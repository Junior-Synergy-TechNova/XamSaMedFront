    <div>
      <pf-page-head [title]="title()"/>
      <div class="pf-cols">
        <pf-card>
          <div class="pf-profhead">
            <span class="pf-roleic lg"><nv-icon [name]="roleIcon()" [size]="28"/></span>
            <div><h3>{{ name() }}</h3><span class="muted">{{ sub() }}</span></div>
          </div>
          @for (f of fields(); track f[0]) {
            <div class="pf-proffield">
              <span class="muted">{{ f[0] }}</span>
              <strong>{{ f[1] }}</strong>
            </div>
          }
          <div class="pf-profacts">
            <button class="btn btn-green btn-sm" (click)="editModal.set(true)"><nv-icon name="user" [size]="15"/> Modifier mon profil</button>
            <button class="btn btn-outline btn-sm" (click)="openPwdModal()"><nv-icon name="shield" [size]="15"/> Mot de passe</button>
          </div>
        </pf-card>
        <pf-card title="Accès rapide" sub="QR code de votre espace">
          <div class="pf-qr">
            <div class="pf-qrcode"><pf-qr/></div>
            <div>
              <p class="muted">Scannez ce code pour accéder instantanément à votre espace depuis un autre appareil.</p>
              <button class="btn btn-outline btn-sm"><nv-icon name="qr" [size]="16"/> Partager mon accès</button>
            </div>
          </div>
        </pf-card>
      </div>

      @if (editModal()) {
        <div class="pf-modal-overlay" (click)="editModal.set(false)">
          <form class="pf-modal" (click)="$event.stopPropagation()" (submit)="submitProfile(eName.value, ePhone.value, eEmail.value); $event.preventDefault()">
            <div class="pf-modal-head">
              <h3>Modifier mon profil</h3>
              <button type="button" class="pf-modal-close" (click)="editModal.set(false)"><nv-icon name="x" [size]="20"/></button>
            </div>
            <div class="pf-modal-body">
              <div class="s-field"><label>Nom</label><input #eName [value]="auth.user()?.name || ''"/></div>
              <div class="s-field"><label>Téléphone</label><input #ePhone [value]="auth.user()?.phone || ''"/></div>
              <div class="s-field"><label>Email</label><input #eEmail type="email" [value]="auth.user()?.email || ''"/></div>
            </div>
            <div class="pf-modal-foot">
              <button type="button" class="btn btn-ghost btn-sm" (click)="editModal.set(false)">Annuler</button>
              <button type="submit" class="btn btn-green btn-sm">Enregistrer</button>
            </div>
          </form>
        </div>
      }

      @if (pwdModal()) {
        <div class="pf-modal-overlay" (click)="pwdModal.set(false)">
          <form class="pf-modal" (click)="$event.stopPropagation()" (submit)="submitPassword(pCur.value, pNew.value, pConf.value); $event.preventDefault()">
            <div class="pf-modal-head">
              <h3>Changer le mot de passe</h3>
              <button type="button" class="pf-modal-close" (click)="pwdModal.set(false)"><nv-icon name="x" [size]="20"/></button>
            </div>
            <div class="pf-modal-body">
              <div class="s-field">
                <label>Mot de passe actuel *</label>
                <div class="pf-pwd">
                  <input #pCur required [type]="showCur() ? 'text' : 'password'" autocomplete="current-password"/>
                  <button type="button" class="pf-pwdeye" (click)="showCur.set(!showCur())" [attr.aria-label]="showCur() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.title]="showCur() ? 'Masquer' : 'Afficher'">
                    <nv-icon [name]="showCur() ? 'eyeOff' : 'eye'" [size]="18"/>
                  </button>
                </div>
              </div>
              <div class="s-field">
                <label>Nouveau mot de passe *</label>
                <div class="pf-pwd">
                  <input #pNew required [type]="showNew() ? 'text' : 'password'" autocomplete="new-password" minlength="6"/>
                  <button type="button" class="pf-pwdeye" (click)="showNew.set(!showNew())" [attr.aria-label]="showNew() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.title]="showNew() ? 'Masquer' : 'Afficher'">
                    <nv-icon [name]="showNew() ? 'eyeOff' : 'eye'" [size]="18"/>
                  </button>
                </div>
              </div>
              <div class="s-field">
                <label>Confirmer *</label>
                <div class="pf-pwd">
                  <input #pConf required [type]="showConf() ? 'text' : 'password'" autocomplete="new-password"/>
                  <button type="button" class="pf-pwdeye" (click)="showConf.set(!showConf())" [attr.aria-label]="showConf() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.title]="showConf() ? 'Masquer' : 'Afficher'">
                    <nv-icon [name]="showConf() ? 'eyeOff' : 'eye'" [size]="18"/>
                  </button>
                </div>
              </div>
            </div>
            <div class="pf-modal-foot">
              <button type="button" class="btn btn-ghost btn-sm" (click)="pwdModal.set(false)">Annuler</button>
              <button type="submit" class="btn btn-green btn-sm">Changer</button>
            </div>
          </form>
        </div>
      }
    </div>
