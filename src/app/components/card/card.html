    <section class="card pf-block {{ extra() }}">
      @if (title() || sub()) {
        <div class="pf-blockhead">
          <div>
            @if (title()) { <h2>{{ title() }}</h2> }
            @if (sub()) { <span class="muted">{{ sub() }}</span> }
          </div>
          <ng-content select="[right]"/>
        </div>
      }
      <ng-content/>
    </section>
