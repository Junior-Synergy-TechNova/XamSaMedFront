<pf-geo-map [markers]="markers()" [selected]="selected()" [maxZoom]="11"
            label="Carte des zones en tension" (select)="sel.emit($event)"/>
<div class="pf-gm-legend">
  <span><i class="red"></i> Critique</span>
  <span><i class="amber"></i> Tension haute</span>
  <span><i class="green"></i> Modérée</span>
  <span><i class="blue"></i> Faible</span>
  <span class="pf-zm-hint">Taille du halo = nombre de ruptures</span>
</div>
@if (unplaced().length > 0) {
  <p class="pf-zm-unplaced">Sans position sur la carte : {{ unplaced().join(', ') }}.</p>
}
